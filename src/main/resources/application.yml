spring:

  jackson:
    time-zone: Europe/Madrid

  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.3:5432/notificator}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  application:
    name: notificator

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  data:
    redis:
      host: ${REDIS_HOST:192.168.1.3}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVER:192.168.1.3:9092}

    consumer:
      group-id: notificator-group
      auto-offset-reset: latest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.julian.notificator.model.MessageRequest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 524288000

    listener:
      ack-mode: record
      retry:
        topic:
          enabled: false

  mail:
    host: ${SMTP_SERVER:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


kafka:
  topics:
    discord: discord-messages
    telegram: telegram-messages
    mail: mail-messages
    alexa: alexa-messages
    whatsapp: whatsapp-messages
    mqtt: mqtt-messages

  group-id: notificator-group


discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}
  webhook-url-news: ${DISCORD_WEBHOOK_URL_NEWS}


telegram:
  proxy-url: ${TELEGRAM_PROXY_URL}
  chat-id: ${TELEGRAM_ID_CHAT}
  
  chat-ids-groups:
    - ${TELEGRAM_ID_GROUP}
    - ${TELEGRAM_ID_GROUP_2}

  chat-ids-channels:
    - ${TELEGRAM_ID_CHANNEL}

  bot-token: ${TELEGRAM_BOT_TOKEN}
  bot-username: ${TELEGRAM_BOT_USERNAME:kafkajgf_bot}

  backend-url: ${TELEGRAM_BACKEND_URL:http://192.168.1.3:8083}
  backend-url2: ${TELEGRAM_BACKEND_URL2:http://192.168.1.3:8083/api/football/live}


rss:
  proxy-url: ${RSS_PROXY_URL:http://192.168.1.3:9002/elmundo.xml}
  proxy-url2: ${RSS_PROXY_URL2:http://192.168.1.3:9002/juegosonce.xml}
  proxy-url3: ${RSS_PROXY_URL3:http://192.168.1.3:9002/atresmedia.xml}
  proxy-url4: ${RSS_PROXY_URL4:http://192.168.1.3:9002/marca.xml}
  proxy-url5: ${RSS_PROXY_URL5:http://192.168.1.3:9002/videojuegos.xml}
  proxy-url6: ${RSS_PROXY_URL6:http://192.168.1.3:9002/enlaces.json}


mail:
