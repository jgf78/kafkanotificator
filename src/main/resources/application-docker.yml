spring:

  application:
    name: notificator

  main:
    allow-bean-definition-overriding: true

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVER:192.168.1.3:9092}

    topics:
      discord: ${TOPIC_DISCORD:discord-messages}
      telegram: ${TOPIC_TELEGRAM:telegram-messages}
      mail: ${TOPIC_MAIL:mail-messages}
      alexa: ${TOPIC_ALEXA:alexa-messages}

    group-id: notificator-group

  mail:
    host: ${SMTP_SERVER:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}


server:
  port: ${SERVER_PORT:8081}

  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}


discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}
  webhook-url-news: ${DISCORD_WEBHOOK_URL_NEWS}


telegram:
  proxy-url: ${TELEGRAM_PROXY_URL}

  chat-id: ${TELEGRAM_ID_CHAT}

  chat-id-group: ${TELEGRAM_ID_GROUP}

  chat-ids-groups:
    - ${TELEGRAM_ID_GROUP}
    - ${TELEGRAM_ID_GROUP_2}

  bot-token: ${TELEGRAM_BOT_TOKEN}

  bot-username: ${TELEGRAM_BOT_USERNAME:kafkajgf_bot}

  backend-url: ${TELEGRAM_BACKEND_URL:http://192.168.1.3:8083}

  backend-url2: ${TELEGRAM_BACKEND_URL2:http://192.168.1.3:8083/api/football/live}


mail:
  to: ${EMAIL_TO}
  subject: ${EMAIL_SUBJECT:Notificación por email}


whatsapp:
  apikey: ${WHATSAPP_APIKEY}
  type: ${WHATSAPP_TYPE:alarm_notification}


mqtt:
  broker: ${MQTT_BROKER:tcp://broker.hivemq.com:1883}
  topic: ${MQTT_TOPIC:notificator/alertas}
  clientId: ${MQTT_CLIENT_ID:notificator-app}
  qos: ${MQTT_QOS:1}


scheduler:
  daily:
    enabled: ${SCHEDULER_ENABLED:true}
    message: ${SCHEDULER_MESSAGE:Buenos días, }
    hour: ${SCHEDULER_HOUR:07}
    minute: ${SCHEDULER_MINUTE:00}
    zone: ${SCHEDULER_ZONE:Europe/Madrid}
    service: ${SCHEDULER_SERVICE:telegramServiceImpl}


logging:
  file:
    path: ${LOG_PATH:/var/logs/}
    name: ${spring.application.name}

  level:
    com.julian: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.boot: ${LOG_LEVEL_SPRING_BOOT:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}